[package]
name = "linux-oom-parser"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Parse Linux OOM killer log messages into typed records using winnow"
license = "MIT"
readme = "README.md"
keywords = ["linux", "oom", "parser", "logs", "winnow"]
categories = ["parser-implementations"]
include = ["src/**", "tests/**", "examples/**", "README.md", "LICENSE", "Cargo.toml", "Cargo.lock"]
repository = "https://github.com/adamflott/linux-oom-parser"

[dependencies]
bytesize = "2"
clap = { version = "4", features = ["derive"] }
jiff = "0.2"
winnow = "1.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
